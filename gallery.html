<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Kota Hub</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Loading Screen -->
    <div class="loader-wrapper" id="loader">
        <img src="images/logo.jpg" alt="Loading..." class="loader-logo">
        <div class="loader-spinner"></div>
    </div>

    <!-- Header / Navigation -->
    <header class="header">
        <div class="container header-inner">
            <a href="index.html" class="logo-link">
                <img src="images/logo.jpg" alt="Kota Hub Logo" class="logo-img">
            </a>

            <!-- Mobile Menu Toggle -->
            <button class="menu-toggle" id="menu-toggle" aria-label="Toggle Menu">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <nav class="nav" id="nav-menu">
                <a href="index.html">Home</a>
                <a href="menu.html">Menu</a>
                <a href="gallery.html" class="active">Gallery</a>
                <a href="contact.html">Contact</a>
            </nav>
            <div class="header-actions">
                <a href="menu.html" class="btn btn-primary">Order Now</a>
            </div>
        </div>
    </header>

    <!-- Gallery Section -->
    <section class="section gallery">
        <div class="container">
            <h2 class="section-title center">Foodie Gallery</h2>
            <div class="gallery-grid" id="gallery-grid">
                <!-- Gallery items injected by script.js -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container footer-content">
            <div class="footer-brand">
                <img src="images/logo.jpg" alt="Kota Hub Logo" class="footer-logo">
                <p>2909 Roets Drive, Vosloorus</p>
                <p>076 447 9915</p>
            </div>
            <div class="footer-links">
                <h4>Quick Links</h4>
                <a href="index.html">Home</a>
                <a href="menu.html">Menu</a>
                <a href="gallery.html">Gallery</a>
            </div>
            <div class="footer-social">
                <h4>Follow Us</h4>
                <a href="#">Facebook</a>
                <a href="#">Instagram</a>
                <a href="#">TikTok</a>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 Kota Hub. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>

</html>
