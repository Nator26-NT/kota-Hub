<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu | Kota Hub</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Loading Screen -->
    <div class="loader-wrapper" id="loader">
        <img src="images/logo.jpg" alt="Loading..." class="loader-logo">
        <div class="loader-spinner"></div>
    </div>

    <!-- Header / Navigation -->
    <header class="header">
        <div class="container header-inner">
            <a href="index.html" class="logo-link">
                <img src="images/logo.jpg" alt="Kota Hub Logo" class="logo-img">
            </a>

            <!-- Mobile Menu Toggle -->
            <button class="menu-toggle" id="menu-toggle" aria-label="Toggle Menu">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <nav class="nav" id="nav-menu">
                <a href="index.html">Home</a>
                <a href="menu.html" class="active">Menu</a>
                <a href="gallery.html">Gallery</a>
                <a href="contact.html">Contact</a>
            </nav>
            <div class="header-actions">
                <a href="#" class="btn btn-primary">Order Now</a>
            </div>
        </div>
    </header>

    <!-- Menu Header -->
    <section class="menu-header">
        <div class="container">
            <h1 class="page-title">Our Menu</h1>
            <p class="page-subtitle">View our full menu boards below.</p>
        </div>
    </section>

    <!-- Menu Images Section -->
    <section class="section menu-images-section">
        <div class="container">
            <div class="menu-image-grid">

                <!-- MENU IMAGE 1: Kota Menu -->
                <div class="menu-board">
                    <h3>Kota Menu</h3>
                    <div class="menu-board-img-wrapper">
                        <img src="images/menu-wings.jpg" alt="Kota Hub Kota Menu" class="menu-board-img">
                    </div>
                </div>

                <!-- MENU IMAGE 2: Dagwood Menu -->
                <div class="menu-board">
                    <h3>Dagwood Menu</h3>
                    <div class="menu-board-img-wrapper">
                        <img src="images/menu-dagwood.jpg" alt="Kota Hub Dagwood Menu" class="menu-board-img">
                    </div>
                </div>

                <!-- MENU IMAGE 3: Wrap, Wings, Sides -->
                <div class="menu-board">
                    <h3>Wrap, Wings & Sides</h3>
                    <div class="menu-board-img-wrapper">
                        <img src="images/menu-wings.jpg" alt="Kota Hub Wrap and Wings Menu" class="menu-board-img">
                    </div>
                </div>

                <!-- MENU IMAGE 4: Burgers and Milkshakes -->
                <div class="menu-board">
                    <h3>Burgers & Milkshakes</h3>
                    <div class="menu-board-img-wrapper">
                        <img src="images/menu-burgers.jpg" alt="Kota Hub Burger and Milkshake Menu" class="menu-board-img">
                    </div>
                </div>

            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container footer-content">
            <div class="footer-brand">
                <img src="images/logo.jpg" alt="Kota Hub Logo" class="footer-logo">
                <p>2909 Roets Drive, Vosloorus</p>
                <p>076 447 9915</p>
            </div>
            <div class="footer-links">
                <h4>Quick Links</h4>
                <a href="index.html">Home</a>
                <a href="menu.html">Menu</a>
                <a href="gallery.html">Gallery</a>
            </div>
            <div class="footer-social">
                <h4>Follow Us</h4>
                <a href="#">Facebook</a>
                <a href="#">Instagram</a>
                <a href="#">TikTok</a>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 Kota Hub. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>

</html>
